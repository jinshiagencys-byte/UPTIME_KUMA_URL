name: Extraction et Génération de Sitemap de Test - Odjafrik

on:
  workflow_dispatch: # Déclenchement manuel sécurisé depuis l'onglet Actions

jobs:
  crawl-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install crawl4ai openai

    - name: Installer Chromium et dépendances système
      run: |
        python -m playwright install --with-deps chromium

    - name: Exécuter le pipeline d'extraction et d'IA
      env:
        # Variable requise par OpenRouter passée de manière sécurisée
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python script_crawl_ai.py

    - name: Sauvegarder les résultats
      uses: actions/upload-artifact@v4
      with:
        name: odjafrik-testing-sitemap
        path: |
          odjafrik_structure.md
          odjafrik_testing_sitemap.json
